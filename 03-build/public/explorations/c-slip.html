<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Slip</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #1e2a22;
    --desk-2: #16201a;
    --slip: #f4efe3;
    --slip-2: #ebe5d6;
    --ink: #1a1a17;
    --ink-2: #5e5b52;
    --ink-3: #9d988b;
    --line: #d8d1bf;
    --stamp: #c2371f;
    --mono: 'Geist Mono', ui-monospace, monospace;
    --sans: 'Geist', system-ui, sans-serif;
    --col: 560px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { background: radial-gradient(120% 80% at 50% 0%, var(--desk) 0%, var(--desk-2) 100%); min-height: 100vh; color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  input { font: inherit; color: inherit; background: none; border: 0; outline: 0 }
  .page { max-width: var(--col); margin: 0 auto; padding: 64px 20px 170px }
  body.phone .page { padding: 28px 12px 120px }

  /* The assistant speaks in mono on the desk */
  .brief { color: #cfd6cf; font-family: var(--mono); font-size: 14px; line-height: 1.6; margin: 0 8px 28px; transition: opacity .3s; max-width: 46ch }
  .brief.fade { opacity: 0 }
  .brief .t { color: #7f8b80; display: block; margin-bottom: 6px; font-size: 12px }

  .stack { display: flex; flex-direction: column; gap: 18px }

  /* A slip: paper with a perforated top edge */
  .item { position: relative; background: var(--slip); color: var(--ink); border-radius: 3px; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 18px 40px -22px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s;
    animation: drop .5s cubic-bezier(.2,.7,.2,1) both }
  .item:nth-child(2) { animation-delay: .08s } .item:nth-child(3) { animation-delay: .16s }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) } }
  .item::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 6px; background: radial-gradient(circle at 6px 0, transparent 0 4px, var(--slip) 4.5px) 0 0 / 12px 6px repeat-x; }
  .item[data-state="gone"] { opacity: 0; transform: translateY(8px) scale(.98); max-height: 0; overflow: hidden; margin-top: -18px }

  .head { padding: 22px 22px 18px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px }
  body.phone .head { grid-template-columns: 1fr; padding: 18px 18px 16px }
  .ref { grid-column: 1 / -1; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .02em; margin-bottom: 10px; text-transform: uppercase }
  .ref .urg { color: var(--stamp) }
  .title { grid-column: 1; font-size: 17px; font-weight: 600; letter-spacing: -.012em; line-height: 1.3 }
  .why { grid-column: 1; color: var(--ink-2); margin-top: 4px; max-width: 48ch }
  .quick { grid-column: 2; grid-row: 2 / span 2; align-self: end; display: flex; gap: 6px }
  body.phone .quick { grid-column: 1; grid-row: auto; margin-top: 14px }
  .item[data-open="true"] .quick { display: none }

  /* Stamp buttons: square, bordered */
  .btn { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 9px 12px; border: 1.5px solid var(--ink); border-radius: 2px; white-space: nowrap; transition: transform .12s, background .12s, color .12s }
  .btn:hover { background: var(--ink); color: var(--slip) }
  .btn:active { transform: translateY(1px) }
  .btn.primary { background: var(--ink); color: var(--slip) }
  .btn.primary:hover { background: var(--stamp); border-color: var(--stamp) }
  .btn.quiet { border-color: transparent; color: var(--ink-2); padding-inline: 6px }
  .btn.quiet:hover { background: none; color: var(--stamp) }

  .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.7,.2,1) }
  .item[data-open="true"] .body { grid-template-rows: 1fr }
  .body > div { overflow: hidden }
  .body-in { padding: 0 22px 22px }
  body.phone .body-in { padding: 0 18px 18px }
  .work { border-top: 1px dashed var(--line); padding-top: 16px }
  .fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-family: var(--mono); font-size: 12px; margin-bottom: 16px }
  .fields dt { color: var(--ink-3) }
  .content { white-space: pre-wrap; font-size: 15.5px; line-height: 1.55 }
  .context { margin-top: 18px; padding: 12px 14px; background: var(--slip-2); border-radius: 2px; font-size: 13.5px; color: var(--ink-2) }
  .context b { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; font-weight: 500 }

  .path { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .03em }
  .path span + span::before { content: " / " ; color: var(--ink-3) }
  .change { display: grid; grid-template-columns: 96px 1fr 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline }
  body.phone .change { grid-template-columns: 1fr; gap: 2px }
  .change .f { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3) }
  .change .b { color: var(--ink-3); text-decoration: line-through } .change .b.empty { text-decoration: none; font-style: italic }
  .change .a { font-weight: 600 } .change .a::before { content: "→ "; color: var(--stamp); font-weight: 400 }

  .question { font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; margin-bottom: 14px }
  .found { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px }
  body.phone .found { grid-template-columns: 1fr; gap: 2px }
  .found dt { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); padding-top: 2px }
  body.phone .found dt { margin-top: 8px }
  .found dd.long { grid-column: 1 / -1; padding: 10px 14px; background: var(--slip-2); border-radius: 2px; color: var(--ink-2); font-style: italic }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 18px }
  .actions .spacer { flex: 1 }
  .reply { margin-top: 14px; display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 2px; padding: 8px 10px }
  .reply::before { content: ">"; font-family: var(--mono); color: var(--ink-3) }
  .reply input { flex: 1 } .reply input::placeholder { color: var(--ink-3) }
  .thread { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 13.5px; font-family: var(--mono) }
  .thread .me::before { content: "YOU  "; color: var(--ink-3); font-size: 11px } .thread .ai { color: var(--ink-2) } .thread .ai::before { content: "IT   "; color: var(--ink-3); font-size: 11px; white-space: pre }

  /* Done: the slip gets stamped and shrinks */
  .item[data-state="done"] .head, .item[data-state="done"] .body { display: none }
  .done { display: none; padding: 14px 22px; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2) }
  .item[data-state="done"] .done { display: flex }
  .item[data-state="done"] { background: var(--slip-2) }
  .done .stamp { color: var(--stamp); border: 2px solid var(--stamp); border-radius: 3px; padding: 3px 7px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; transform: rotate(-4deg); animation: stamp .25s cubic-bezier(.2,1.4,.4,1) both }
  @keyframes stamp { from { transform: rotate(-4deg) scale(1.6); opacity: 0 } }
  .done .undo { margin-left: auto; text-decoration: underline; text-underline-offset: 3px; color: var(--ink) }

  .floor { font-family: var(--mono); font-size: 12px; color: #7f8b80; margin: 24px 8px 0; opacity: 0; transition: opacity .4s }
  .floor.show { opacity: 1 }

  .composer { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(var(--col), calc(100% - 40px)) }
  body.phone .composer { bottom: 12px; width: calc(100% - 24px) }
  .composer form { background: var(--slip); border-radius: 3px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 18px 40px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.3); font-family: var(--mono) }
  .composer form::before { content: ">"; color: var(--ink-3) }
  .composer input { flex: 1; font-size: 14px } .composer input::placeholder { color: var(--ink-3) }
</style>
</head>
<body>
<main class="page">
  <p class="brief" id="brief"><span class="t">WED 23 AUG · 08:20</span>Morning. Three things need you — one before Daniel's board meets Thursday.</p>
  <section class="stack" id="stack"></section>
  <p class="floor" id="floor">— nothing else. I'll be back if anything comes up.</p>
</main>
<div class="composer"><form><input placeholder="Tell it something…" aria-label="Instruction"></form></div>

<script src="_fixtures.js"></script>
<script>
const R = {
  document: b => `<div class="work"><dl class="fields">${b.fields.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join('')}</dl><div class="content">${esc(b.content)}</div>${b.context?`<div class="context"><b>${esc(b.context.label)}</b>${esc(b.context.content)}</div>`:''}</div>`,
  diff: b => `<div class="work"><div class="path">${b.path.map(p=>`<span>${esc(p)}</span>`).join('')}</div>${b.changes.map(c=>`<div class="change"><span class="f">${esc(c.field)}</span><span class="b ${c.before===null?'empty':''}">${c.before===null?'empty':esc(c.before)}</span><span class="a">${esc(c.after)}</span></div>`).join('')}</div>`,
  evidence: b => `<div class="work"><div class="question">${esc(b.question)}</div><dl class="found">${b.found.map(f=>`<dt>${esc(f.label)}</dt><dd class="${f.long?'long':''}">${esc(f.value)}</dd>`).join('')}</dl>${b.options?`<div class="chips">${b.options.map(o=>`<button class="btn" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:''}</div>`,
};
const label = a => ({approve:a.label||'Approve', approveAlways:`Always · ${a.scope}`, edit:'Edit', discard:'Discard'}[a.kind]);
const urg = {now:'Due Thu', today:'Today', whenever:'Whenever'};
document.getElementById('stack').innerHTML = LIGHT_DAY.map((wb,i)=>{
  const q = wb.body.kind==='evidence' ? `<button class="btn" data-act="open">Answer</button>` :
    wb.actions.filter(a=>a.kind==='approve'||a.kind==='edit').map(a=>`<button class="btn ${a.kind==='approve'?'primary':''}" data-act="${a.kind}">${label(a)}</button>`).join('');
  return `<article class="item" id="${wb.id}" data-urgency="${wb.urgency}" data-open="false" data-state="waiting">
    <div class="head"><div class="ref"><span>${esc(wb.source)} · ${esc(wb.raisedAt)}</span><span class="${wb.urgency==='now'?'urg':''}">${urg[wb.urgency]} · №${i+1}</span></div>
      <div class="title">${esc(wb.title)}</div><div class="why">${esc(wb.why)}</div><div class="quick">${q}</div></div>
    <div class="body"><div><div class="body-in">${R[wb.body.kind](wb.body)}
      <div class="actions">${wb.actions.filter(a=>a.kind!=='answer').map(a=>a.kind==='discard'?`<span class="spacer"></span><button class="btn quiet" data-act="discard">Discard</button>`:`<button class="btn ${a.kind==='edit'?'':'primary'}" data-act="${a.kind}">${label(a)}</button>`).join('')}</div>
      <div class="thread" hidden></div><form class="reply"><input placeholder="tell it something about this"></form></div></div></div>
    <div class="done"><span class="stamp">Done</span><span class="done-msg"></span><button class="undo">undo</button></div>
  </article>`;
}).join('');
wire({ stack: document.getElementById('stack'), brief: document.getElementById('brief'), floor: document.getElementById('floor'),
  briefDone: `<span class="t">WED 23 AUG · 08:24</span>That's everything. Next I'm drafting Friday's report.` });
</script>
</body>
</html>
