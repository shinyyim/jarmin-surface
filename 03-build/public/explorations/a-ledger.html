<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f1ea;
    --ink: #141311;
    --ink-2: #5d5a52;
    --ink-3: #9a968c;
    --line: #d9d5ca;
    --line-strong: #141311;
    --red: #c8321e;
    --sans: 'Schibsted Grotesk', system-ui, sans-serif;
    --mono: 'Fragment Mono', ui-monospace, monospace;
    --col: 760px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  input { font: inherit; color: inherit; background: none; border: 0; outline: 0 }

  .page { max-width: var(--col); margin: 0 auto; padding: 56px 24px 160px }
  body.phone .page { padding: 28px 16px 120px }

  /* Header — a ledger heading */
  .brief { border-bottom: 2px solid var(--line-strong); padding-bottom: 14px; margin-bottom: 4px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; transition: opacity .3s }
  .brief.fade { opacity: 0 }
  .brief h1 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; max-width: 30ch; text-wrap: balance }
  body.phone .brief h1 { font-size: 22px }
  .brief .stamp { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.5; white-space: nowrap }
  .brief .stamp b { display: block; color: var(--ink); font-weight: 400 }

  /* Column heads */
  .cols { display: grid; grid-template-columns: 56px 1fr 180px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 0; border-bottom: 1px solid var(--line) }
  body.phone .cols { display: none }

  /* Rows */
  .item { border-bottom: 1px solid var(--line); position: relative; transition: opacity .35s, transform .35s }
  .item[data-state="gone"] { opacity: 0; transform: translateX(-8px); max-height: 0; overflow: hidden; border: 0 }
  .head { display: grid; grid-template-columns: 56px 1fr 180px; gap: 0 12px; padding: 16px 0 14px; cursor: pointer; align-items: start }
  body.phone .head { grid-template-columns: 1fr; padding: 14px 0 }
  .no { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 4px }
  .item[data-urgency="now"] .no { color: var(--red) }
  .item[data-urgency="now"] .no::after { content: " ●"; font-size: 8px; vertical-align: 2px }
  body.phone .no { display: none }
  .title { font-size: 17px; font-weight: 500; letter-spacing: -.01em }
  .why { color: var(--ink-2); margin-top: 3px; max-width: 58ch }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 8px }
  .meta i { font-style: normal; color: var(--ink-2) }
  .quick { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 2px }
  body.phone .quick { flex-direction: row; align-items: center; gap: 18px; margin-top: 10px }
  .item[data-open="true"] .quick { visibility: hidden }
  body.phone .item[data-open="true"] .quick { display: none }

  /* Text actions with key hints */
  .act { display: inline-flex; align-items: baseline; gap: 8px; padding: 4px 0; font-weight: 500; white-space: nowrap; border-bottom: 1px solid transparent }
  .act:hover { border-bottom-color: var(--ink) }
  .act kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; line-height: 16px }
  .act.primary { color: var(--ink) }
  .act.primary kbd { color: var(--ink); border-color: var(--ink) }
  .act.quiet { color: var(--ink-2); font-weight: 400 }

  /* Expanded */
  .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.7,.2,1) }
  .item[data-open="true"] .body { grid-template-rows: 1fr }
  .body > div { overflow: hidden }
  .body-in { display: grid; grid-template-columns: 56px 1fr; gap: 0 12px; padding-bottom: 22px }
  body.phone .body-in { grid-template-columns: 1fr }
  .body-in > * { grid-column: 2 }
  body.phone .body-in > * { grid-column: 1 }

  .work { border-top: 1px solid var(--line-strong); padding-top: 14px }
  .fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; font-family: var(--mono); font-size: 12.5px; margin-bottom: 16px }
  .fields dt { color: var(--ink-3) }
  .content { white-space: pre-wrap; font-size: 16px; line-height: 1.55; max-width: 62ch }
  .context { margin-top: 18px; padding: 12px 0 0; border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink-2); max-width: 62ch }
  .context b { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; font-weight: 400 }

  .path { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-bottom: 10px }
  .path span + span::before { content: "  /  "; color: var(--ink-3) }
  table.diff { border-collapse: collapse; width: 100%; font-size: 15px }
  table.diff td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top }
  table.diff td.f { font-family: var(--mono); font-size: 12px; color: var(--ink-3); width: 120px; padding-top: 11px }
  table.diff td.b { color: var(--ink-3); text-decoration: line-through; width: 34% }
  table.diff td.b.empty { text-decoration: none; font-style: italic }
  table.diff td.a { font-weight: 500 }
  table.diff td.a::before { content: "→  "; color: var(--ink-3); font-weight: 400 }

  .question { font-size: 19px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 14px; max-width: 40ch }
  .found { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 15px }
  body.phone .found { grid-template-columns: 1fr; gap: 2px 0 }
  .found dt { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 2px }
  body.phone .found dt { margin-top: 8px }
  .found dd.long { grid-column: 1 / -1; padding-left: 14px; border-left: 2px solid var(--line-strong); color: var(--ink-2); font-style: italic; max-width: 60ch }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px }
  .chips .act { font-weight: 500 }

  .actions { display: flex; flex-wrap: wrap; gap: 4px 26px; align-items: baseline; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line-strong) }
  .actions .spacer { flex: 1 }
  .reply { margin-top: 14px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 6px 0; max-width: 62ch }
  .reply::before { content: ">"; font-family: var(--mono); color: var(--ink-3) }
  .reply input { flex: 1; font-size: 15px }
  .reply input::placeholder { color: var(--ink-3) }
  .thread { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 14px; max-width: 62ch }
  .thread .me { color: var(--ink); } .thread .me::before { content: "you  "; font-family: var(--mono); font-size: 11px; color: var(--ink-3) }
  .thread .ai { color: var(--ink-2) } .thread .ai::before { content: "it   "; font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: pre }

  /* Done */
  .item[data-state="done"] .head, .item[data-state="done"] .body { display: none }
  .done { display: none; grid-template-columns: 56px 1fr auto; gap: 12px; padding: 12px 0; font-family: var(--mono); font-size: 13px; color: var(--ink-2); align-items: baseline }
  body.phone .done { grid-template-columns: 1fr auto }
  .item[data-state="done"] .done { display: grid }
  .done .tick { color: var(--ink) } body.phone .done .tick { display: none }
  .done .undo { text-decoration: underline; text-underline-offset: 3px; color: var(--ink) }

  .floor { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 14px; opacity: 0; transition: opacity .4s }
  .floor.show { opacity: 1 }

  /* Composer — a ledger line at the bottom */
  .composer { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(var(--col), 100%); padding: 14px 24px 22px; background: linear-gradient(to top, var(--paper) 70%, transparent) }
  body.phone .composer { padding: 10px 16px 16px }
  .composer form { display: flex; gap: 12px; align-items: baseline; border-top: 2px solid var(--line-strong); padding-top: 10px }
  .composer form::before { content: "›"; font-family: var(--mono); color: var(--ink) }
  .composer input { flex: 1; font-size: 15px }
  .composer input::placeholder { color: var(--ink-3) }
  .composer kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3) }
</style>
</head>
<body>
<main class="page">
  <header class="brief" id="brief">
    <h1>Morning. Three things need you — one before Daniel's board meets Thursday.</h1>
    <div class="stamp"><b>Wed 23 Aug</b>08:20 · 3 open</div>
  </header>
  <div class="cols"><span>No.</span><span>Item</span><span style="text-align:right">Action</span></div>
  <section id="stack"></section>
  <p class="floor" id="floor">— nothing else. I'll be back if anything comes up.</p>
</main>
<div class="composer"><form><input placeholder="Tell it something…" aria-label="Instruction"><kbd>↵</kbd></form></div>

<script src="_fixtures.js"></script>
<script>
const R = {
  document: b => `<div class="work"><dl class="fields">${b.fields.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join('')}</dl><div class="content">${esc(b.content)}</div>${b.context?`<div class="context"><b>${esc(b.context.label)}</b>${esc(b.context.content)}</div>`:''}</div>`,
  diff: b => `<div class="work"><div class="path">${b.path.map(p=>`<span>${esc(p)}</span>`).join('')}</div><table class="diff">${b.changes.map(c=>`<tr><td class="f">${esc(c.field)}</td><td class="b ${c.before===null?'empty':''}">${c.before===null?'empty':esc(c.before)}</td><td class="a">${esc(c.after)}</td></tr>`).join('')}</table></div>`,
  evidence: b => `<div class="work"><div class="question">${esc(b.question)}</div><dl class="found">${b.found.map(f=>`<dt>${esc(f.label)}</dt><dd class="${f.long?'long':''}">${esc(f.value)}</dd>`).join('')}</dl>${b.options?`<div class="chips">${b.options.map((o,i)=>`<button class="act" data-answer="${esc(o)}"><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div>`:''}</div>`,
};
const label = a => ({approve:a.label||'Approve', approveAlways:`Always — ${a.scope}`, edit:'Edit', discard:'Discard'}[a.kind]);
const key = a => ({approve:'A', approveAlways:'⇧A', edit:'E', discard:'X'}[a.kind]);
document.getElementById('stack').innerHTML = LIGHT_DAY.map((wb,i)=>{
  const q = wb.body.kind==='evidence' ? `<button class="act primary" data-act="open"><kbd>↵</kbd>Answer</button>` :
    wb.actions.filter(a=>a.kind==='approve'||a.kind==='edit').map(a=>`<button class="act ${a.kind==='approve'?'primary':'quiet'}" data-act="${a.kind}"><kbd>${key(a)}</kbd>${label(a)}</button>`).join('');
  return `<article class="item" id="${wb.id}" data-urgency="${wb.urgency}" data-open="false" data-state="waiting">
    <div class="head"><div class="no">0${i+1}</div><div><div class="title">${esc(wb.title)}</div><div class="why">${esc(wb.why)}</div><div class="meta"><i>${esc(wb.source)}</i> · ${esc(wb.raisedAt)}</div></div><div class="quick">${q}</div></div>
    <div class="body"><div><div class="body-in">${R[wb.body.kind](wb.body)}
      <div class="actions">${wb.actions.filter(a=>a.kind!=='answer').map(a=>a.kind==='discard'?`<span class="spacer"></span><button class="act quiet" data-act="discard"><kbd>X</kbd>Discard</button>`:`<button class="act ${a.kind==='edit'?'quiet':'primary'}" data-act="${a.kind}"><kbd>${key(a)}</kbd>${label(a)}</button>`).join('')}</div>
      <div class="thread" hidden></div><form class="reply"><input placeholder="Tell it something about this…"></form></div></div></div>
    <div class="done"><span class="tick">✓</span><span class="done-msg"></span><button class="undo">undo</button></div>
  </article>`;
}).join('');
wire({ stack: document.getElementById('stack'), brief: document.getElementById('brief'), floor: document.getElementById('floor'),
  briefDone: `<h1>That's everything. Next I'm drafting Friday's report.</h1><div class="stamp"><b>Wed 23 Aug</b>08:24 · 0 open</div>` });
</script>
</body>
</html>
