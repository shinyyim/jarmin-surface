<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Jarmin · desktop + phone</title>
<style>*{box-sizing:border-box;margin:0}body{background:#e9e9e9;font:13px -apple-system,system-ui;padding:20px;display:grid;grid-template-columns:1fr 410px;gap:24px;height:100vh}
iframe{border:0;width:100%;height:100%;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.phone{width:390px;height:min(820px,calc(100vh - 40px));border-radius:46px;border:9px solid #111;background:#111;overflow:hidden;align-self:center;position:relative}
.phone iframe{border-radius:38px}.phone::after{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:16px;background:#111}
nav{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:9}nav a{font:600 12px -apple-system,system-ui;color:#333;background:#fff;padding:5px 10px;border-radius:999px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}</style></head>
<body><nav><a href="?day=light">light</a><a href="?day=heavy">heavy</a></nav><iframe id="a"></iframe><div class="phone"><iframe id="b"></iframe></div>
<script>const d=new URLSearchParams(location.search).get('day')||'light';a.src=`/?day=${d}`;b.src=`/?day=${d}`;</script></body></html>
